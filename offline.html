<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ece8df" />
    <meta
      name="description"
      content="本地优先的 Markdown 阅读器，支持主题、代码高亮、数学公式、流程图与离线使用。"
    />
    <title>MarkView Lab</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="reader.css" />
    <script>
      (() => {
        const appearance = localStorage.getItem("markview-appearance") || "system";
        const dark =
          appearance === "dark" ||
          (appearance === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-mark-grid">
              <span class="brand-mark-tile brand-mark-tile-a"></span>
              <span class="brand-mark-tile brand-mark-tile-b"></span>
              <span class="brand-mark-tile brand-mark-tile-c"></span>
            </span>
          </div>
          <div class="brand-copy">
            <div class="brand-title">
              <span class="brand-title-main">MarkView</span>
              <span class="brand-title-accent">Lab</span>
            </div>
            <div class="brand-meta">
              <span class="brand-subtitle" id="hero-badge">专注阅读的 Markdown 预览器</span>
              <span class="connection-status" id="connection-status" data-status="ready">
                <span class="connection-dot"></span>
                <span id="connection-label">本地就绪</span>
              </span>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <button class="action-btn action-btn-primary" id="open-file-btn" type="button">
            打开文件
          </button>
          <button class="action-btn action-btn-secondary" id="open-link-btn" type="button">
            输入链接
          </button>
          <button class="action-btn install-btn" id="install-app-btn" type="button" hidden>
            安装应用
          </button>
          <select id="lang-select" class="topbar-select" aria-label="Language">
            <option value="zh-Hans">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
          <button
            class="theme-trigger"
            id="theme-trigger"
            type="button"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            <span class="aa-icon">Aa</span>
            <span class="aa-divider"></span>
            <span class="aa-theme-name" id="aa-theme-name">默认</span>
            <span class="aa-arrow" aria-hidden="true">▾</span>
          </button>
        </div>
      </header>

      <input
        id="file-input"
        type="file"
        accept=".md,.markdown,.txt,text/markdown,text/plain"
        hidden
      />

      <div
        class="theme-popover"
        id="theme-popover"
        role="dialog"
        aria-label="阅读设置"
        aria-hidden="true"
        inert
      >
        <div class="popover-section">
          <div class="popover-section-title" id="label-appearance">外观</div>
          <div class="appear-group" id="appear-group">
            <button class="appear-option" data-mode="system" type="button">System</button>
            <button class="appear-option" data-mode="light" type="button">Light</button>
            <button class="appear-option" data-mode="dark" type="button">Dark</button>
          </div>
          <div class="fontsize-row">
            <span class="fontsize-label" id="label-fontsize">字号</span>
            <div class="fontsize-stepper">
              <button class="stepper-btn" id="fontsize-minus" type="button" aria-label="减小字号">
                −
              </button>
              <span class="stepper-value" id="fontsize-value">17px</span>
              <button class="stepper-btn" id="fontsize-plus" type="button" aria-label="增大字号">
                +
              </button>
            </div>
          </div>
          <label class="measure-row" for="measure-select">
            <span class="fontsize-label" id="label-measure">行宽</span>
            <select id="measure-select" class="measure-select">
              <option value="narrow">紧凑</option>
              <option value="comfortable">舒适</option>
              <option value="wide">宽屏</option>
            </select>
          </label>
        </div>
        <div class="popover-divider"></div>
        <div class="popover-section">
          <div class="popover-section-title" id="label-theme">主题</div>
          <div class="theme-list" id="theme-list">
            <button class="theme-option active" data-theme="default" type="button">
              <span>
                <span class="theme-name">默认</span>
                <span class="theme-sub">干净、通用的无衬线阅读</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
            <button class="theme-option" data-theme="essay" type="button">
              <span>
                <span class="theme-name">专栏</span>
                <span class="theme-sub">适合长文的衬线排版</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
            <button class="theme-option" data-theme="notebook" type="button">
              <span>
                <span class="theme-name">手帐</span>
                <span class="theme-sub">温暖柔和的笔记风格</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
            <button class="theme-option" data-theme="terminal" type="button">
              <span>
                <span class="theme-name">终端</span>
                <span class="theme-sub">等宽、高对比的技术感</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
            <button class="theme-option" data-theme="github" type="button">
              <span>
                <span class="theme-name">GitHub</span>
                <span class="theme-sub">熟悉克制的文档风格</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
          </div>
        </div>
      </div>
      <button class="popover-backdrop" id="popover-backdrop" type="button" aria-label="关闭设置"></button>

      <main class="card-wrapper">
        <div class="viewer-shell" id="viewer-shell">
          <button
            class="outline-reopen"
            id="outline-reopen"
            type="button"
            aria-label="打开大纲"
            title="打开大纲"
          >
            <span></span><span></span><span></span>
          </button>

          <aside class="outline-sidebar" id="outline-sidebar">
            <div class="outline-sidebar-head">
              <div>
                <div class="outline-title" id="outline-title">大纲</div>
                <div class="outline-count" id="outline-count">0 个标题</div>
              </div>
              <button
                class="outline-toggle"
                id="outline-toggle"
                type="button"
                aria-label="收起大纲"
                title="收起大纲"
              >
                ⟨
              </button>
            </div>
            <nav class="outline-nav" id="outline-nav" aria-label="文档大纲">
              <div class="outline-empty" id="outline-empty">当前内容没有标题结构</div>
            </nav>
          </aside>
          <button
            class="outline-backdrop"
            id="outline-backdrop"
            type="button"
            aria-label="关闭大纲"
          ></button>

          <section class="card-bg" id="card-bg" aria-label="Markdown 阅读区">
            <div class="reading-progress" aria-hidden="true">
              <span id="reading-progress-bar"></span>
            </div>
            <div class="document-bar">
              <div class="document-identity">
                <span class="document-icon" aria-hidden="true">M↓</span>
                <div class="document-copy">
                  <div class="document-name" id="document-name">MarkView 示例文档</div>
                  <div class="document-meta" id="document-meta">示例 · 0 字 · 约 1 分钟</div>
                </div>
              </div>
              <div class="document-actions">
                <span class="progress-label" id="progress-label">0%</span>
                <button class="document-action" id="copy-markdown-btn" type="button">
                  复制原文
                </button>
                <button class="document-action" id="card-close-btn" type="button" hidden>
                  返回示例
                </button>
              </div>
            </div>
            <article id="preview-content" class="default-theme">
              <div class="loading-hint">Loading…</div>
            </article>
          </section>
        </div>
      </main>

      <div class="drop-overlay" id="drop-overlay">
        <div class="drop-hint">
          <div class="drop-icon" aria-hidden="true">↓</div>
          <div class="drop-text" id="drop-text">拖放以预览</div>
          <div class="drop-subtext">.md · .markdown · .txt</div>
        </div>
      </div>

      <div class="modal-backdrop" id="link-modal-backdrop"></div>
      <section
        class="link-modal"
        id="link-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="link-modal-title"
        aria-hidden="true"
        inert
      >
        <div class="link-modal-head">
          <div>
            <div class="link-modal-title" id="link-modal-title">打开 Markdown 链接</div>
            <div class="link-modal-desc" id="link-modal-desc">内容只在当前浏览器中处理。</div>
          </div>
          <button class="modal-close" id="link-modal-close" type="button" aria-label="关闭">×</button>
        </div>
        <form id="link-form">
          <label class="link-field" for="link-input">
            <span id="link-input-label">链接地址</span>
            <input
              id="link-input"
              type="text"
              inputmode="url"
              autocomplete="url"
              placeholder="https://example.com/readme.md"
            />
          </label>
          <div class="link-note" id="link-note">
            远程站点需要允许跨域读取；本地文件请使用“打开文件”。
          </div>
          <div class="modal-actions">
            <button class="modal-btn" id="link-cancel-btn" type="button">取消</button>
            <button class="modal-btn modal-btn-primary" id="link-submit-btn" type="submit">
              读取链接
            </button>
          </div>
        </form>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="vendor/js/marked.umd.js"></script>
    <script src="vendor/js/purify.min.js"></script>
    <script src="vendor/js/highlight.min.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <script src="vendor/katex/contrib/auto-render.min.js"></script>
    <script src="vendor/js/mermaid.min.js"></script>
    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
